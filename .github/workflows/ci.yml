name: Community CI
on:
  push:
    branches: [root]
  pull_request:
    branches: [root]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ls --depth=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit
      - run: git diff --exit-code
